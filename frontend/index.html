<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Bidding System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }

        .status-connected {
            background-color: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-disconnected {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        .status-reconnecting {
            background-color: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .highest-bid {
            text-align: center;
            padding: 30px;
        }

        .highest-bid-amount {
            font-size: 3em;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }

        .highest-bidder {
            font-size: 1.2em;
            color: #666;
            margin-top: 10px;
        }

        .no-bids {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .bid-history {
            grid-column: 1 / -1;
        }

        .bid-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .bid-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s;
        }

        .bid-item:hover {
            background-color: #f5f5f5;
        }

        .bid-item:last-child {
            border-bottom: none;
        }

        .bid-item.new-bid {
            animation: highlight 1s ease-in-out;
        }

        @keyframes highlight {
            0%, 100% { background-color: transparent; }
            50% { background-color: #fef3c7; }
        }

        .bid-info {
            display: flex;
            flex-direction: column;
        }

        .bid-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .bid-time {
            font-size: 0.85em;
            color: #999;
            margin-top: 4px;
        }

        .bid-amount {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #c33;
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3c3;
        }

        .connection-status {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Real-Time Bidding System
            <span id="statusIndicator" class="status-indicator status-disconnected"></span>
        </h1>
        
        <div class="connection-status" id="connectionStatus">Connecting...</div>

        <div class="grid">
            <div class="card highest-bid">
                <h2>Current Highest Bid</h2>
                <div id="highestBidContent">
                    <div class="no-bids">No bids yet. Be the first!</div>
                </div>
            </div>

            <div class="card">
                <h2>Place Your Bid</h2>
                <div id="messageContainer"></div>
                <form id="bidForm">
                    <div class="form-group">
                        <label for="bidderName">Your Name</label>
                        <input 
                            type="text" 
                            id="bidderName" 
                            placeholder="Enter your name" 
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="bidAmount">Bid Amount ($)</label>
                        <input 
                            type="number" 
                            id="bidAmount" 
                            placeholder="Enter bid amount" 
                            step="0.01" 
                            min="0.01"
                            required
                        >
                    </div>
                    <button type="submit" id="submitBtn">Place Bid</button>
                </form>
            </div>

            <div class="card bid-history">
                <h2>Bid History</h2>
                <div class="bid-list" id="bidHistory">
                    <div class="no-bids">Loading bid history...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectTimeout = null;
        let reconnectAttempts = 0;
        const maxReconnectDelay = 30000;
        const baseReconnectDelay = 1000;

        const statusIndicator = document.getElementById('statusIndicator');
        const connectionStatus = document.getElementById('connectionStatus');
        const highestBidContent = document.getElementById('highestBidContent');
        const bidHistory = document.getElementById('bidHistory');
        const bidForm = document.getElementById('bidForm');
        const messageContainer = document.getElementById('messageContainer');
        const submitBtn = document.getElementById('submitBtn');

        function updateConnectionStatus(status, message) {
            statusIndicator.className = 'status-indicator status-' + status;
            connectionStatus.textContent = message;
        }

        function showMessage(message, type = 'error') {
            const messageDiv = document.createElement('div');
            messageDiv.className = type + '-message';
            messageDiv.textContent = message;
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        function updateHighestBid(bid) {
            if (!bid) {
                highestBidContent.innerHTML = '<div class="no-bids">No bids yet. Be the first!</div>';
                return;
            }

            highestBidContent.innerHTML = `
                <div class="highest-bid-amount">${formatCurrency(bid.amount)}</div>
                <div class="highest-bidder">by ${bid.bidder_name}</div>
                <div class="bid-time">${formatTimestamp(bid.timestamp)}</div>
            `;
        }

        function updateBidHistory(bids) {
            if (!bids || bids.length === 0) {
                bidHistory.innerHTML = '<div class="no-bids">No bids yet</div>';
                return;
            }

            bidHistory.innerHTML = bids.map(bid => `
                <div class="bid-item">
                    <div class="bid-info">
                        <div class="bid-name">${bid.bidder_name}</div>
                        <div class="bid-time">${formatTimestamp(bid.timestamp)}</div>
                    </div>
                    <div class="bid-amount">${formatCurrency(bid.amount)}</div>
                </div>
            `).join('');
        }

        function addNewBidToHistory(bid) {
            const bidItem = document.createElement('div');
            bidItem.className = 'bid-item new-bid';
            bidItem.innerHTML = `
                <div class="bid-info">
                    <div class="bid-name">${bid.bidder_name}</div>
                    <div class="bid-time">${formatTimestamp(bid.timestamp)}</div>
                </div>
                <div class="bid-amount">${formatCurrency(bid.amount)}</div>
            `;
            
            const noBidsMsg = bidHistory.querySelector('.no-bids');
            if (noBidsMsg) {
                bidHistory.innerHTML = '';
            }
            
            bidHistory.insertBefore(bidItem, bidHistory.firstChild);
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host; // This includes the port from the URL bar
            const wsUrl = `${protocol}//${host}/ws`;

            updateConnectionStatus('reconnecting', 'Connecting...');
            submitBtn.disabled = true;

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    updateConnectionStatus('connected', 'Connected');
                    reconnectAttempts = 0;
                    submitBtn.disabled = false;
                    
                    if (reconnectTimeout) {
                        clearTimeout(reconnectTimeout);
                        reconnectTimeout = null;
                    }
                };

                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        console.log('Received:', message);

                        switch (message.type) {
                            case 'initial_data':
                                updateHighestBid(message.data.highest_bid);
                                updateBidHistory(message.data.bid_history);
                                break;

                            case 'new_bid':
                                updateHighestBid(message.data);
                                addNewBidToHistory(message.data);
                                break;

                            case 'error':
                                showMessage(message.message, 'error');
                                break;

                            case 'bid_history':
                                updateBidHistory(message.data);
                                break;
                        }
                    } catch (error) {
                        console.error('Error parsing message:', error);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus('disconnected', 'Connection error');
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected');
                    updateConnectionStatus('disconnected', 'Disconnected');
                    submitBtn.disabled = true;
                    ws = null;
                    
                    scheduleReconnect();
                };

            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (reconnectTimeout) return;

            reconnectAttempts++;
            const delay = Math.min(
                baseReconnectDelay * Math.pow(2, reconnectAttempts - 1),
                maxReconnectDelay
            );

            updateConnectionStatus('reconnecting', `Reconnecting in ${Math.ceil(delay / 1000)}s...`);

            reconnectTimeout = setTimeout(() => {
                reconnectTimeout = null;
                connectWebSocket();
            }, delay);
        }

        bidForm.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showMessage('Not connected to server. Please wait...', 'error');
                return;
            }

            const bidderName = document.getElementById('bidderName').value.trim();
            const bidAmount = parseFloat(document.getElementById('bidAmount').value);

            if (!bidderName) {
                showMessage('Please enter your name', 'error');
                return;
            }

            if (isNaN(bidAmount) || bidAmount <= 0) {
                showMessage('Please enter a valid bid amount', 'error');
                return;
            }

            try {
                ws.send(JSON.stringify({
                    type: 'new_bid',
                    bidder_name: bidderName,
                    amount: bidAmount
                }));

                document.getElementById('bidAmount').value = '';
                showMessage('Bid submitted!', 'success');
            } catch (error) {
                console.error('Error sending bid:', error);
                showMessage('Failed to submit bid. Please try again.', 'error');
            }
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && (!ws || ws.readyState !== WebSocket.OPEN)) {
                connectWebSocket();
            }
        });

        // Handle online/offline events
        window.addEventListener('online', () => {
            console.log('Network online');
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connectWebSocket();
            }
        });

        window.addEventListener('offline', () => {
            console.log('Network offline');
            updateConnectionStatus('disconnected', 'No internet connection');
        });

        // Initial connection
        connectWebSocket();
    </script>
</body>
</html>
