version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bidding_postgres
    environment:
      POSTGRES_DB: bidsdb
      POSTGRES_USER: biduser
      POSTGRES_PASSWORD: bidpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biduser -d bidsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bidding_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidding_backend1
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bidsdb
      POSTGRES_USER: biduser
      POSTGRES_PASSWORD: bidpassword
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidding_backend2
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bidsdb
      POSTGRES_USER: biduser
      POSTGRES_PASSWORD: bidpassword
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidding_backend3
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: bidsdb
      POSTGRES_USER: biduser
      POSTGRES_PASSWORD: bidpassword
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: bidding_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend1:
        condition: service_started
      backend2:
        condition: service_started
      backend3:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: